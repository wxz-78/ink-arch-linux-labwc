# Ink — mpv. Decodificación por hardware y OSD en grises.
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes
screenshot-directory=~/Pictures
volume-max=100

osd-font="JetBrainsMono Nerd Font"
osd-font-size=32
osd-color="#e8e8e8"
osd-border-color="#0a0a0a"
osd-bar-align-y=0.9
