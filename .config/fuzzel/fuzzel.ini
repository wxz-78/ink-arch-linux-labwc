# Ink — fuzzel. Colores RRGGBBAA sin '#'.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="  "
placeholder=buscar…
icon-theme=Papirus-Dark
layer=overlay
anchor=center
width=40
lines=8
horizontal-pad=26
vertical-pad=20
inner-pad=12
line-height=28
image-size-ratio=0.5
fields=name,generic,keywords
show-actions=no

[colors]
background=0f0f0ff2
text=9a9a9aff
prompt=ffffffff
placeholder=5c5c5cff
input=ffffffff
match=ffffffff
selection=ffffff22
selection-text=ffffffff
selection-match=ffffffff
counter=5c5c5cff
border=ffffff30

[border]
width=1
radius=20

[dmenu]
exit-immediately-if-empty=yes
