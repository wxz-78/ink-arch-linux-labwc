# Ink — fuzzel. Estilo Spotlight, minimalista en grises.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="    "
placeholder=Buscar…
icon-theme=Papirus-Dark
layer=overlay
anchor=center
width=38
lines=9
horizontal-pad=32
vertical-pad=22
inner-pad=14
line-height=30
image-size-ratio=0.5
fields=name,generic,keywords,exec
show-actions=no

[colors]
background=101010f5
text=bfbfbfff
prompt=f5f5f5ff
placeholder=6a6a6aff
input=f5f5f5ff
match=f5f5f5ff
selection=e7e7e7ff
selection-text=101010ff
selection-match=101010ff
counter=6a6a6aff
border=ffffff1f

[border]
width=1
radius=26

[dmenu]
exit-immediately-if-empty=yes
